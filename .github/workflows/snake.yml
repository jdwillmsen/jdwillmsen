name: Generate Profile Images

on:
  schedule:
    - cron: "0 0 * * *"  # Runs at 00:00 UTC every day
  workflow_dispatch:  # Allows manual trigger
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  # Third-party renderers and their npm installs run here with a read-only
  # token; only the publish job below can write to the repository.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate trophies
        run: deno run -A scripts/trophy.ts "${{ github.repository_owner }}" dist/trophy.svg:flat dist/trophy-dark.svg:onedark
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}

      - name: Check out activity graph renderer
        uses: actions/checkout@v7
        with:
          repository: Ashutosh00710/github-readme-activity-graph
          ref: 0962e9461de815933d462e8b98c7ce566cada8fb
          path: activity-graph
          persist-credentials: false

      # The project only ships as a web server, so run it locally just long
      # enough to fetch the two themed images. On an API failure it still
      # answers 200 with an error image, which lacks the graph title.
      - name: Generate activity graph
        working-directory: activity-graph
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USER: ${{ github.repository_owner }}
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm run build
          PORT=5100 node dist/main.js &
          for _ in $(seq 30); do curl -sf -o /dev/null localhost:5100/ && break; sleep 1; done
          curl -sf -o ../dist/activity-graph.svg "localhost:5100/graph?username=$USER&theme=github-light&hide_border=true"
          curl -sf -o ../dist/activity-graph-dark.svg "localhost:5100/graph?username=$USER&theme=one-dark&hide_border=true"
          grep -q 'Contribution Graph' ../dist/activity-graph.svg
          grep -q 'Contribution Graph' ../dist/activity-graph-dark.svg

      - name: Upload images
        uses: actions/upload-artifact@v7
        with:
          name: profile-images
          path: dist

  publish:
    needs: generate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Download images
        uses: actions/download-artifact@v8
        with:
          name: profile-images
          path: dist

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
