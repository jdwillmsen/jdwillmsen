name: Generate Profile Images

on:
  schedule:
    - cron: "0 0 * * *"  # Runs at 00:00 UTC every day
  workflow_dispatch:  # Allows manual trigger
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Generate Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Generate trophies
        run: deno run -A scripts/trophy.ts "${{ github.repository_owner }}" dist/trophy.svg:flat dist/trophy-dark.svg:onedark
        env:
          GITHUB_TOKEN1: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: profile-images
          path: dist

      - name: Push to output branch
        if: github.event_name != 'pull_request'
        uses: crazy-max/ghaction-github-pages@v5.0.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
